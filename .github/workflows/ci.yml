name: CI

on:
  push:
  pull_request:
  public:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.repository.visibility == 'public'
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - name: Install dependencies without heavyweight binaries
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Component tests
        run: npm run test:component
      - name: Build
        run: npm run build:app

  electron-self-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.repository.visibility == 'public'
    name: Electron integration (macOS)
    needs: fast
    runs-on: macos-15
    timeout-minutes: 12
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run native Electron integration test
        run: npm run test:electron
